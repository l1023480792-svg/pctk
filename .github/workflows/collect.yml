name: collect-prices
on:
  schedule:
    - cron: "0 16 * * *"   # UTC 16:00 = 北京/新加坡时间 0:00（GitHub定时可能延迟几分钟到半小时）
  workflow_dispatch:        # 允许手动点击运行
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python collect.py
      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update prices" && git push)
